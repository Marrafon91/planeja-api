<app-header titulo="Dashboard"></app-header>

<main class="p-6">
  @if (dashboard$ | async; as dashboard) {
    <section class="mb-5.5 grid grid-cols-[1.4fr_1fr_1fr] gap-4.5">
      <div class="flex min-h-33 flex-col justify-center gap-2 border-l-5 border-(--turquesa) p-5.5">
        <span class="text-[13px] font-semibold text-[#777] uppercase"> Saldo Atual </span>
        <strong
          [ngClass]="dashboard.resumo.saldo >= 0 ? 'text-(--turquesa-escuro)' : 'text-[#e74c3c]'"
        >
          {{ dashboard.resumo.saldo }}
        </strong>
        <small> {{ dashboard.mes }} </small>
      </div>
    </section>
  }
</main>
